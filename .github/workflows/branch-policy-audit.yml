name: Branch Policy Audit

on:
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: branch-policy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Branch policy audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Verify push came through the approved PR path
        run: node workflow/audit-branch-push.mjs
        env:
          GH_TOKEN: ${{ github.token }}
