name: ProofMode control sync

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request_target:
    branches: [dev, main]
    types: [opened, reopened, closed, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: ["ProofMode CI", "ProofMode PR guard"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

jobs:
  lifecycle:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: proofmode-pr-state-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update controlling Issue lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: node workflow/handle-pr-state.mjs

  sync:
    needs: lifecycle
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: proofmode-control-sync-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Synchronize canonical control Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node workflow/control-sync.mjs
