name: Stage11 Mobile Lockfile

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install current mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Resolve SDK-compatible notifications package
        working-directory: mobile
        run: npx expo install expo-notifications --npm
      - name: Verify generated dependency graph
        working-directory: mobile
        run: npm run typecheck
      - uses: actions/upload-artifact@v6
        with:
          name: stage11-mobile-lockfile
          path: |
            mobile/package.json
            mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1
