name: Stage11 Mobile Lockfile

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install current mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Resolve SDK-compatible notifications package
        working-directory: mobile
        run: npx expo install expo-notifications --npm
      - name: Verify generated dependency graph
        working-directory: mobile
        run: npm run typecheck
      - name: Commit generated dependency files
        shell: bash
        run: |
          if git diff --quiet -- mobile/package.json mobile/package-lock.json; then
            echo "Expo notification dependency files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git commit -m "Add Expo notifications mobile dependency"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
