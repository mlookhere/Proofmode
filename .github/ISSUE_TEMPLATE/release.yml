name: Release
description: Release-control Issue for promoting dev to main
labels: ["type:release", "state:ready"]
body:
  - type: textarea
    id: included
    attributes:
      label: Included Issues
      description: List every release-ready Issue included in this release. The release automation uses this section to close shipped work after merge to main.
      placeholder: |
        - #123
        - #124
    validations:
      required: true
  - type: textarea
    id: release
    attributes:
      label: Release target
      description: Version/tag and observable release outcome.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Release verification
      placeholder: |
        - [ ] All required CI checks pass on dev
        - [ ] Database migrations applied/verified when applicable
        - [ ] External deployment gates documented
        - [ ] Release notes/version/tag are synchronized
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Managed handoff state
      value: |
        <!-- state:start -->
        _No session state yet._
        <!-- state:end -->
